name: Final workout pull-up-bar photograph
on:
  push:
    branches: [feat/forma-photo-cards-2026-11-25]
permissions:
  contents: write
jobs:
  photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Bundle pull-up-bar photo
        run: |
          python - <<'PY'
          import urllib.request,io
          from PIL import Image,ImageOps
          req=urllib.request.Request('https://images.unsplash.com/photo-1758520705400-1edfdcd78cf5?w=1050&h=750&fit=crop&q=78',headers={'User-Agent':'FormaApp'})
          with urllib.request.urlopen(req,timeout=30) as r: data=r.read()
          im=Image.open(io.BytesIO(data)).convert('RGB')
          im=ImageOps.fit(im,(900,600),method=Image.Resampling.LANCZOS)
          im.save('src/assets/activities/workout.webp','WEBP',quality=76,method=6)
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "forma-assets-bot"
          git config user.email "forma-assets-bot@users.noreply.github.com"
          git rm .github/workflows/finalize-forma-workout-photo.yml
          git add src/assets/activities/workout.webp
          git commit -m "assets: use actual outdoor parallel bars for workout"
          git push origin HEAD:feat/forma-photo-cards-2026-11-25
