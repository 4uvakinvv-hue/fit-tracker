name: KURS Widget APK
on:
  push:
    branches:
      - kurs-widget-apk-build
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Confirm Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: cd kurs-android && gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kurs-weekly-v0.3-apk
          path: kurs-android/app/build/outputs/apk/debug/app-debug.apk
