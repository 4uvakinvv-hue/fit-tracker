name: KURS Widget APK
on:
  push:
    branches:
      - kurs-widget-apk-build
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test
        run: |
          echo OK > kurs-widget-ci.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kurs-widget-ci.txt
          git commit -m 'KURS widget CI smoke test'
          git push
