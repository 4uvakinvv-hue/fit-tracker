name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forma-android-v1.1
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Stamp Android version
        run: |
          sed -i 's/versionCode 1/versionCode 110/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.1"/' android/app/build.gradle

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/forma-v1.1.apk
          cp app/build/outputs/bundle/debug/app-debug.aab app/build/outputs/bundle/debug/forma-v1.1.aab

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: forma-android
          path: |
            android/app/build/outputs/apk/debug/forma-v1.1.apk
            android/app/build/outputs/bundle/debug/forma-v1.1.aab

      - name: Publish latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-v1.1 -y --cleanup-tag || true
          gh release create android-v1.1 android/app/build/outputs/apk/debug/forma-v1.1.apk android/app/build/outputs/bundle/debug/forma-v1.1.aab --title "Форма Android 1.1" --notes "Актуальная Android-сборка приложения Форма." --prerelease
