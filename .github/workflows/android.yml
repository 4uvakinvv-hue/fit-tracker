name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rustore_version_code:
        description: "RuStore versionCode (leave empty for the existing GitHub build)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ inputs.rustore_version_code != '' && 'forma-android-rustore' || 'forma-android-v2.1-final' }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Configure native step counter, Health Connect and Android version
        run: |
          sed -i 's/minSdkVersion = 24/minSdkVersion = 26/' android/variables.gradle
          sed -i '/<application/i\    <uses-permission android:name="android.permission.ACTIVITY_RECOGNITION" />\n    <uses-permission android:name="android.permission.health.READ_HEALTH_DATA_HISTORY" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />' android/app/src/main/AndroidManifest.xml
          sed -i '/dependencies {/a\    implementation "androidx.work:work-runtime:2.9.1"\n    implementation "com.google.guava:guava:33.2.1-android"' android/app/build.gradle
          mkdir -p android/app/src/main/java/ru/forma/app
          cp native/android/MainActivity.java android/app/src/main/java/ru/forma/app/MainActivity.java
          cp native/android/StepCounterPlugin.java android/app/src/main/java/ru/forma/app/StepCounterPlugin.java
          cp native/android/StepCounterStore.java android/app/src/main/java/ru/forma/app/StepCounterStore.java
          cp native/android/StepCounterWorker.java android/app/src/main/java/ru/forma/app/StepCounterWorker.java
          cp native/android/FlaneuringStore.java android/app/src/main/java/ru/forma/app/FlaneuringStore.java
          cp native/android/FlaneuringService.java android/app/src/main/java/ru/forma/app/FlaneuringService.java
          cp native/android/FlaneuringPlugin.java android/app/src/main/java/ru/forma/app/FlaneuringPlugin.java
          sed -i '/<\/application>/i\        <service android:name=".FlaneuringService" android:foregroundServiceType="location" android:exported="false" />' android/app/src/main/AndroidManifest.xml
          sed -i 's/versionCode 1/versionCode 2108/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "2.1"/' android/app/build.gradle

      - name: Build and sign RuStore APK
        if: inputs.rustore_version_code != ''
        env:
          VERSION_CODE: ${{ inputs.rustore_version_code }}
          KEYSTORE_BASE64: ${{ secrets.FORMA_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FORMA_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FORMA_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FORMA_RELEASE_KEY_PASSWORD }}
          SIGNER_SHA256: "4367C4C345E8BD7F9A88CC902D6B48032E8608A1F43805733E9578DEEFA8D5BC"
        run: |
          set -euo pipefail
          current_version_code=$(awk '$1 == "versionCode" { print $2 }' android/app/build.gradle)
          [[ "$current_version_code" =~ ^[1-9][0-9]*$ ]] || { echo "Could not read the current Android versionCode."; exit 1; }
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]] && (( VERSION_CODE > current_version_code && VERSION_CODE <= 2100000000 )) || {
            echo "Use a versionCode higher than the previous release and at most 2100000000."
            exit 1
          }
          : "${KEYSTORE_BASE64:?Missing release keystore}" "${STORE_PASSWORD:?Missing store password}"
          : "${KEY_ALIAS:?Missing key alias}" "${KEY_PASSWORD:?Missing key password}"
          [[ "$SIGNER_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "Invalid expected SHA-256 signing certificate fingerprint."; exit 1; }

          umask 077
          key_dir=$(mktemp -d)
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key_dir/forma-release.p12"
          unset KEYSTORE_BASE64

          sed -i "s/versionCode $current_version_code/versionCode $VERSION_CODE/" android/app/build.gradle
          (cd android && chmod +x gradlew && env -u STORE_PASSWORD -u KEY_PASSWORD ./gradlew assembleRelease)

          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$build_tools/zipalign" -P 16 -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$key_dir/aligned.apk"
          "$build_tools/apksigner" sign --ks "$key_dir/forma-release.p12" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out forma-rustore.apk "$key_dir/aligned.apk"
          cert=$("$build_tools/apksigner" verify --print-certs forma-rustore.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          [[ "${cert,,}" == "${SIGNER_SHA256,,}" ]] || { echo "Unexpected signing certificate."; exit 1; }
          "$build_tools/aapt" dump badging forma-rustore.apk | (head -n 1; cat >/dev/null) | grep -F "name='ru.forma.app' versionCode='$VERSION_CODE'"

      - name: Upload RuStore APK
        if: inputs.rustore_version_code != ''
        uses: actions/upload-artifact@v4
        with:
          name: forma-rustore-${{ inputs.rustore_version_code }}
          path: forma-rustore.apk
          if-no-files-found: error

      - name: Build APK
        if: inputs.rustore_version_code == ''
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/forma-v2.1.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/forma-android.apk
          cp app/build/outputs/bundle/debug/app-debug.aab app/build/outputs/bundle/debug/forma-v2.1.aab

      - name: Upload workflow artifact
        if: inputs.rustore_version_code == ''
        uses: actions/upload-artifact@v4
        with:
          name: forma-android
          path: |
            android/app/build/outputs/apk/debug/forma-v2.1.apk
            android/app/build/outputs/bundle/debug/forma-v2.1.aab

      - name: Publish versioned release
        if: inputs.rustore_version_code == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-v2.1 -y --cleanup-tag || true
          gh release create android-v2.1 android/app/build/outputs/apk/debug/forma-v2.1.apk android/app/build/outputs/bundle/debug/forma-v2.1.aab --title "Форма Android 2.1" --notes "Forma 2.1: обновлённые тренировки тренера, тоннаж с учётом собственного веса, профиль и история." --prerelease

      - name: Publish stable Android download
        if: inputs.rustore_version_code == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-current -y --cleanup-tag || true
          gh release create android-current android/app/build/outputs/apk/debug/forma-android.apk --title "Форма Android — актуальная версия" --notes "Актуальная Forma 2.1: тренировки, тоннаж, профиль." --prerelease
