name: Extract exact approved Forma activity cards
on:
  push:
    branches: [fix/approved-activity-images-2026-11-25]
permissions:
  contents: write
jobs:
  crop-approved-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Extract unchanged, lossless card regions from approved screenshot
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Image.open('docs/references/2026-11-25_activities_FINAL_APPROVED.png').convert('RGB')
          assert source.size == (941,1672), source.size
          cards = {
            'gym': (34,365,459,712),
            'outdoor': (472,365,898,712),
            'workout': (34,725,459,1068),
            'combat': (472,725,898,1068),
            'crossfit': (34,1080,459,1429),
          }
          path = Path('src/assets/activities')
          path.mkdir(parents=True,exist_ok=True)
          for name,box in cards.items():
            target = path / ('approved-'+name+'.png')
            source.crop(box).save(target,optimize=True)
            print(str(target),target.stat().st_size)
          PY
      - name: Commit approved crops and remove temporary workflow
        run: |
          git config user.name "forma-assets-bot"
          git config user.email "forma-assets-bot@users.noreply.github.com"
          git rm .github/workflows/extract-approved-forma-cards.yml
          git add src/assets/activities/approved-*.png
          git commit -m "assets: preserve exact lossless approved activity-card artwork"
          git push origin HEAD:fix/approved-activity-images-2026-11-25
