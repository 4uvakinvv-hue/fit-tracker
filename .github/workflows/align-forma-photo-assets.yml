name: Align Forma images to approved cards

on:
  push:
    branches: [feat/forma-photo-cards-2026-11-25]

permissions:
  contents: write

jobs:
  adjust-photo-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Download approved-subject photos and optimize
        shell: bash
        run: |
          python - <<'PY'
          import io, os, time, urllib.request
          from PIL import Image, ImageOps
          source={
            'gym': 'https://images.unsplash.com/photo-1747251929370-f5842533a6c2',
            'workout': 'https://images.unsplash.com/photo-1779258648896-7e645a84f503',
            'steps': 'https://images.unsplash.com/photo-1763538426490-fc4e09053da8',
            'series': 'https://images.unsplash.com/photo-1760464907224-0a1dda1596b9',
          }
          for name,url in source.items():
            for attempt in range(3):
              try:
                target=url+'?w=1050&h=750&fit=crop&q=78'
                request=urllib.request.Request(target,headers={'User-Agent':'FormaApp/2.1'})
                with urllib.request.urlopen(request,timeout=25) as result: data=result.read()
                photo=Image.open(io.BytesIO(data)).convert('RGB')
                assert photo.width>=300 and photo.height>=220
                photo=ImageOps.fit(photo,(900,600),method=Image.Resampling.LANCZOS)
                path=f'src/assets/activities/{name}.webp'
                photo.save(path,'WEBP',quality=76,method=6)
                print(name,os.stat(path).st_size)
                break
              except Exception as e:
                print(f'Attempt {attempt+1} for {name}:',repr(e))
                if attempt==2: raise
                time.sleep(2)
          PY
      - name: Commit improved photos and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "forma-assets-bot"
          git config user.email "forma-assets-bot@users.noreply.github.com"
          git rm .github/workflows/align-forma-photo-assets.yml
          git add src/assets/activities/
          git commit -m "assets: match gym, workout, steps, and series photography to approved subjects"
          git push origin HEAD:feat/forma-photo-cards-2026-11-25
