name: Prepare approved local Forma photo assets

on:
  push:
    branches: [feat/forma-photo-cards-2026-11-25]

permissions:
  contents: write

jobs:
  bundle-photo-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Download and optimize licensed activity photos
        shell: bash
        run: |
          python - <<'PY'
          import io, os, time, urllib.request
          from PIL import Image, ImageOps
          source = {
            "gym": "https://images.unsplash.com/photo-1583454110551-21f2fa2afe61",
            "outdoor": "https://images.squarespace-cdn.com/content/v1/5af635497e3c3afe59776e1c/1534625388871-R592OH24UMMQHNF3QQQ5/david-hellmann-286496-unsplash.jpg",
            "workout": "https://images.unsplash.com/photo-1599058917212-d750089bc07e",
            "combat": "https://images.unsplash.com/photo-1612179736716-d643f0bdcf4e",
            "crossfit": "https://images.unsplash.com/photo-1517836357463-d25dfeac3438",
            "hike": "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b",
            "steps": "https://images.unsplash.com/photo-1552674605-db6ffd4facb5",
            "series": "https://images.unsplash.com/photo-1476480862126-209bfaa8edc8",
          }
          os.makedirs("src/assets/activities",exist_ok=True)
          for name,url in source.items():
              err=None
              for attempt in range(3):
                  try:
                      target=url+"?w=1050&h=750&fit=crop&q=78"
                      request=urllib.request.Request(target,headers={"User-Agent":"Forma/2.1 photo asset bundler"})
                      with urllib.request.urlopen(request,timeout=30) as response:
                          data=response.read()
                      image=Image.open(io.BytesIO(data)).convert("RGB")
                      assert image.width>=300 and image.height>=220, f"Too small: {image.size}"
                      image=ImageOps.fit(image,(900,600),method=Image.Resampling.LANCZOS)
                      path=f"src/assets/activities/{name}.webp"
                      image.save(path,"WEBP",quality=76,method=6)
                      print(name,image.size,os.stat(path).st_size)
                      err=None
                      break
                  except Exception as e:
                      err=e
                      print(name,"attempt",attempt+1,repr(e))
                      time.sleep(2)
              if err is not None:
                  raise RuntimeError(f"Could not bundle {name}: {err}")
          PY
      - name: Commit bundled media and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "forma-assets-bot"
          git config user.email "forma-assets-bot@users.noreply.github.com"
          git rm .github/workflows/import-forma-photo-assets.yml
          git add src/assets/activities/
          git commit -m "assets: bundle eight local WebP photos and remove importer"
          git push origin HEAD:feat/forma-photo-cards-2026-11-25
